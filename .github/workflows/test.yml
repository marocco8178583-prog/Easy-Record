# CI: build and run all automated suites before any deploy. (Prepared; not executed on GitHub by the author.)
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: node build.js
      - run: npm test
        env: { PUPPETEER: puppeteer }
